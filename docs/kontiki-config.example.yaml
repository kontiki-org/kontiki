# Example configuration for a Kontiki service.
# Copy and adapt; use your own top-level keys (e.g. "app") for application settings.
# See docs/configuration.md for the full reference.

kontiki:
  # Host identity for this process (optional; else class name / name attribute):
  # service_name: alert-engine-earth

  # Outbound targets for RpcProxy(peer="…") / open_session(peer="…"):
  # peers:
  #   billing: billing-engine-earth
  #   catalog: catalog-service

  amqp:
    url: "amqp://guest:guest@localhost/"
    rpc:
      timeout: 10
    serialization: "pickle"   # json is deprecated (startup warning); removal planned in a future major release
    max_pending_messages: 10  # prefetch: limits unacknowledged messages per consumer (load balancing, backpressure)
    # tls:
    #   enabled: true
    #   ca_cert: /path/to/ca.pem
    #   client_cert: /path/to/client.pem
    #   client_key: /path/to/client-key.pem

  registration:
    disable: false
    delay: 2
    group: business  # or platform; blank → business
    report_uncaught_exceptions: true  # RPC, HTTP, @on_event, @task; opt out with false
    # configuration:
    #   public_paths: ["app", "feature_flags"]

  heartbeat:
    interval: 60

  shutdown:
    grace_seconds: 25

  http:
    address: "0.0.0.0"
    port: 8080
    documentation:
      enabled: true
      path_template: "/api/{version}/docs"
      title: "My API"
      description: "API documentation for my service."

# Application-specific config (do not use "kontiki" for your own keys).
# app:
#   http:
#     ping_path: "/ping"
