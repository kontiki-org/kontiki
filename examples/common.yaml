# Shared by make run-*-service.
# Omit formatters → Kontiki injects the default line format.
# See docs/configuration.md.

kontiki:
  amqp:
    url: amqp://guest:guest@localhost/

logging:
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
  root:
    handlers: [console]
    level: DEBUG
