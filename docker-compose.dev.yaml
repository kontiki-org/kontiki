# docker-compose.dev.yml
services:
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lavinmq:
    profiles: ["lavinmq"]
    image: cloudamqp/lavinmq:2.11.1
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "lavinmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
